name: StudyTrack PaaS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (TypeScript)
        run: npx tsc --noEmit

      - name: Build Next.js project (Vercel Dry-Run)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-ci.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key-ci"
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: "demo"
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: "demo_preset"
